[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "board-tune"
version = "0.1.0"
description = "Hook-based customization of Linux boards over SSH or through their boot media"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["kconfiglib>=14.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
board-tune = "board_tune.cli:main"

[tool.setuptools.packages.find]
include = ["board_tune*"]

[tool.setuptools.package-data]
"*" = ["Kconfig", "*.Kconfig", "hooks/*.Kconfig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
