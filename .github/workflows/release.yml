name: Debian release and APT repository

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-tune-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a matching version tag
        run: |
          version=$(dpkg-parsechangelog -ldebian/changelog -SVersion)
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v${version%-*}"
      - name: Build and check Debian packages
        run: |
          scripts/build-deb
          cp -aL dist/latest-build dist/debian
      - uses: actions/upload-artifact@v4
        with:
          name: debian-release
          path: dist/debian/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: debian-release
          path: dist/debian
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Import archive signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: scripts/ci-signing-key
      - name: Upload release and collect published versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release-assets
      - name: Build signed repository
        run: |
          python3 tools/build_apt_repo.py --packages dist/archive --output dist/apt \
            --key "$APT_SIGNING_KEY_ID" --passphrase-file "$GNUPGHOME/passphrase"
      - name: Verify signed APT installation and tamper rejection
        run: python3 tools/check_apt_repo.py --repo dist/apt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/apt
      - name: Deploy repository
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            gpgconf --kill all || true
            rm -rf -- "$GNUPGHOME"
          fi
